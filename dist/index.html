<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>準備中 — 酒コスパ横断データベース</title>
<style>
  :root { --bg:#faf9f7; --ink:#1c1a17; --sub:#6b6560; --line:#ddd8d2; --accent:#7a4a2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --ink:#e8e4de; --sub:#9a938b; --line:#332f2b; --accent:#c8926a; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); padding:2rem;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; line-height:1.9;
  }
  main { max-width:34rem; }
  h1 { font-size:1.5rem; margin:0 0 1rem; letter-spacing:.02em; }
  p { color:var(--sub); margin:0 0 1rem; }
  .tag {
    display:inline-block; font-size:.72rem; letter-spacing:.14em;
    color:var(--accent); border:1px solid var(--line); padding:.2rem .6rem; margin-bottom:1.5rem;
  }
  .notice {
    margin-top:2rem; padding-top:1rem; border-top:1px solid var(--line);
    font-size:.82rem; color:var(--sub);
  }
  .notice strong { color:var(--ink); }
</style>
</head>
<body>
<main>
  <span class="tag">準備中</span>
  <h1>蒸留酒・果実酒のコスパ横断データベース</h1>
  <p>
    純アルコール量あたりの単価、ポイント還元を含む実質価格、評価スコアを
    横断して比較できるようにする準備をしています。
  </p>
  <p>味の評価は書きません。数値で比べられるものだけを扱います。</p>
  <div class="notice">
    <strong>20歳未満の者の飲酒は法律で禁じられています。</strong><br>
    このサイトは20歳以上の方を対象としています。
  </div>
</main>
</body>
</html>
