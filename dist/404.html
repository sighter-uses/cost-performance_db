<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません</title>
<style>
  :root { --bg:#faf9f7; --ink:#1c1a17; --sub:#6b6560; --line:#ddd8d2; --accent:#7a4a2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --ink:#e8e4de; --sub:#9a938b; --line:#332f2b; --accent:#c8926a; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); padding:2rem;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; line-height:1.9;
  }
  main { max-width:30rem; }
  h1 { font-size:1.3rem; margin:0 0 .8rem; }
  p { color:var(--sub); margin:0 0 1.2rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動または削除された可能性があります。</p>
  <p><a href="/">トップへ戻る</a></p>
</main>
</body>
</html>
