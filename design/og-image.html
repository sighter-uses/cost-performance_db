<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OG画像の原稿 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Murecho:wght@400;500&family=Shippori+Mincho+B1:wght@500;700&display=swap">
<script>
  // #shot を付けて開くと枠だけになる（ヘッドレスで撮るとき用）
  if (location.hash === '#shot') document.documentElement.classList.add('shot');
</script>
<style>
  /* ページ側の余白。撮影対象は .og だけ。 */
  body { margin: 0; background: #2a2a2a; display: grid; place-items: center; min-height: 100vh;
         font-family: Murecho, sans-serif; }
  .guide { color: #888; font-size: 13px; margin: 24px 0 12px; text-align: center; line-height: 1.9; }
  .guide code { background: #000; padding: 2px 7px; border-radius: 3px; color: #ddd; }
  .shot body { display: block; min-height: 0; background: #0a0908; }
  .shot .guide { display: none; }

  /* ── ここから下が実際の画像（1200×630、これがちょうどOGの規定サイズ） ── */
  /* 色と書体はサイト本体（scripts/lib/view.mjs）と同じ。 */
  .og, .og * { box-sizing: border-box; }
  .og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #0a0908 url(photos/og-photo.png) 62% 50% / cover no-repeat;
    color: #f4eee2;
    font-family: Murecho, 'Hiragino Sans', sans-serif;
  }
  /* 写真の左側はもともと暗いが、文字の下だけさらに沈めて読みやすくする。
     グラスのある右側には掛けない。 */
  .og .veil { position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(8,7,6,.86) 0%, rgba(8,7,6,.62) 38%, rgba(8,7,6,0) 60%); }

  .og .inner { position: relative; height: 100%; padding: 70px 80px 64px;
               display: flex; flex-direction: column; }
  .og .brand { display: flex; align-items: center; gap: 16px; }
  .og .brand svg { width: 38px; height: 47px; flex: none; }
  .og .brand b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px;
                 font-weight: 600; letter-spacing: .012em; line-height: 1; }
  .og .brand small { display: block; margin-top: 5px; font-size: 13px; letter-spacing: .2em; color: #ab9f8c; }

  .og h1 { margin: auto 0 22px; font-family: 'Shippori Mincho B1', serif; font-size: 66px; font-weight: 500;
           line-height: 1.36; letter-spacing: .03em; }
  .og h1 em { font-style: normal; font-weight: 700; color: #e3b671; }
  .og .sub { margin: 0; font-size: 24px; line-height: 1.75; color: #c9bca8; }
  .og .sub b { font-weight: 500; color: #f4eee2; }
</style>
</head>
<body>

<p class="guide">
  下の枠がそのまま <b>1200×630</b> の画像です。<br>
  書き出し: <code>npm run og</code>（Edge か Chrome のヘッドレスで撮って <code>dist/og.jpg</code> にする）<br>
  背景の写真は <code>design/photos/og-photo.png</code>
</p>

<div class="og">
  <div class="veil"></div>
  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 40 50" fill="none" aria-hidden="true">
        <path d="M9 5h22l-2.5 17a8.5 8.5 0 0 1-17 0L9 5Z" stroke="#e3b671" stroke-width="2.2" stroke-linejoin="round"></path>
        <path d="M11.6 14h16.8" stroke="#c8933f" stroke-width="2"></path>
        <path d="M20 30.5V45M13 45h14" stroke="#e3b671" stroke-width="2.2" stroke-linecap="round"></path>
      </svg>
      <span><b>SpiritLens</b><small>Better Spirits, Better Moments.</small></span>
    </div>

    <h1>その一杯に、<br><em>もっと納得を。</em></h1>
    <p class="sub">蒸留酒を<b>純アルコール20gあたりの価格</b>で比べる。</p>
  </div>
</div>

<p class="guide">
  件数や価格は入れていません —— データが更新されるたびに画像が嘘になるためです。
</p>

</body>
</html>
